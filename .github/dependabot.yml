# Dependabot will run on day 16 of each month at 01:04 (Europe/Berlin timezone)
version: 2
updates:

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "cron"
      day: 5
      timezone: "Europe/Berlin"
      cronjob: "4 1 16 * *"
    open-pull-requests-limit: 15
    assignees:
      - "H5N1v2"
    versioning-strategy: "increase"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      day: 5
      timezone: "Europe/Berlin"
      cronjob: "4 1 16 * *"
    open-pull-requests-limit: 15
    assignees:
      - "H5N1v2"
